name: CI

# Checks on every push to main and on every pull request, drafts included:
# delegated sessions open a draft PR at their first push (workspace decision
# 0013, amended 2026-10-20), so a branch is checked before the founder lands
# it. Deploys run only from the founder's Mac with the workspace .envrc
# (workspace docs/runbooks/cloudflare-deploys.md); CI never deploys and holds
# no Cloudflare token.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn typecheck
      - run: yarn test
